<div id="linear-next-view">
  <div class="queue-heading">
    <div><div class="eyebrow">WORKSPACE / LINEAR</div><h2>Your next move<span class="title-dot">.</span></h2><p class="text-small text-muted" id="queue-meta"></p></div>
    <button class="btn btn-primary" type="button" id="queue-refresh">Refresh from Linear</button>
  </div>
  <div class="queue-overview" id="queue-overview"></div>
  <p id="queue-status" aria-live="polite"></p>
  <div class="nav nav-pills" role="tablist" aria-label="Task queue">
    <button class="nav-link active" id="next-tab" type="button" role="tab" aria-controls="next-panel" aria-selected="true">Next batch</button>
    <button class="nav-link" id="work-tab" type="button" role="tab" aria-controls="work-panel" aria-selected="false">In flight</button>
    <button class="nav-link" id="held-tab" type="button" role="tab" aria-controls="held-panel" aria-selected="false">Held</button>
    <button class="nav-link" id="edges-tab" type="button" role="tab" aria-controls="edges-panel" aria-selected="false">Dependency review</button>
  </div>
  <div id="next-panel" role="tabpanel" aria-labelledby="next-tab"><div id="queue-next"></div></div>
  <div id="work-panel" role="tabpanel" aria-labelledby="work-tab" hidden><div id="queue-work"></div></div>
  <div id="held-panel" role="tabpanel" aria-labelledby="held-tab" hidden><div id="queue-held"></div></div>
  <div id="edges-panel" role="tabpanel" aria-labelledby="edges-tab" hidden><div id="queue-edges"></div></div>
  <p class="text-small text-muted" id="queue-foot"></p>
</div>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#20232b}
#linear-next-view{--ink:#20232b;--muted:#77808e;--line:#e5e8ee;--accent:#6259dc;max-width:1180px;margin:0 auto;padding:32px 28px 24px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);overflow-wrap:anywhere}
#linear-next-view h2,#linear-next-view h3,#linear-next-view p{margin:0}
#linear-next-view .eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:10px}
#linear-next-view h2{font-size:38px;line-height:1.2;letter-spacing:-1.5px;font-weight:650}.title-dot{color:#7669ed}
#linear-next-view .queue-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.queue-heading p{margin-top:10px!important;color:#77808e;font-size:12px}
#linear-next-view button{font:inherit;cursor:pointer;transition:background .15s,box-shadow .15s}
#linear-next-view .btn{border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:#fff;color:#575f70;font-size:12px;font-weight:600}
#linear-next-view .btn:hover{background:#f2f0ff;border-color:#c8c2fa}#linear-next-view .btn-primary{background:#6259dc;border-color:#6259dc;color:white;padding:11px 17px;box-shadow:0 3px 9px #6259dc22}#linear-next-view .btn-primary:hover{background:#5148c9}
#linear-next-view button:disabled{opacity:.45;cursor:default}#linear-next-view :focus-visible{outline:3px solid #b4adff;outline-offset:3px}
#linear-next-view .queue-overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 20px}
#linear-next-view .metric{background:white;border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:3px solid var(--line);box-shadow:0 2px 3px #20232b02}.metric strong{display:block;font-size:29px;font-weight:600;letter-spacing:-1px;line-height:1.3}.metric span{font-size:11px;color:#77808e}.metric:first-child{border-top-color:#7669ed}.metric:first-child strong{color:#6259dc}
#linear-next-view #queue-status:empty{display:none}#linear-next-view #queue-status{padding:12px 16px;background:#fff7e7;border:1px solid #f0deba;border-radius:9px;font-size:12px;color:#8b6629;margin-bottom:22px}
#linear-next-view .nav{display:flex;flex-wrap:nowrap;gap:24px;border-bottom:1px solid #dfe3e9;margin-bottom:20px;overflow-x:auto}#linear-next-view .nav-link{white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;color:#7a8190;padding:0 2px 13px;font-size:12px;font-weight:600;border-radius:0}#linear-next-view .nav-link.active{color:#6259dc;border-bottom-color:#6259dc}
#linear-next-view [hidden]{display:none!important}#linear-next-view #queue-next>p{margin-bottom:16px}
#linear-next-view .queue-item{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:0;box-shadow:0 3px 8px #20232b03;min-width:0}#linear-next-view #queue-next .queue-item{margin:0;border-top:3px solid #b2aaf2}
#linear-next-view h3{font-size:17px;line-height:1.45;letter-spacing:-.25px;font-weight:600;margin-top:9px}#linear-next-view .queue-kicker{font-size:10px;color:#838898;letter-spacing:.3px}#linear-next-view .queue-reason{font-size:12px;color:#697383;line-height:1.7;margin-top:12px;max-width:80ch}
#linear-next-view .queue-links{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid #f0f1f5}#linear-next-view a{color:#6259dc;text-decoration:none;font-size:12px;font-weight:600}#linear-next-view a:hover{text-decoration:underline}
#linear-next-view details{margin-top:15px;color:#77808e;font-size:11px}#linear-next-view summary{cursor:pointer}#linear-next-view details ul{padding-left:18px}#linear-next-view .queue-section{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:16px}#linear-next-view .queue-section>summary{font-size:13px;color:#4f5869;font-weight:600}#linear-next-view .queue-section .queue-item{margin-top:15px;margin-bottom:0}#linear-next-view #queue-foot{border-top:1px solid var(--line);padding-top:16px;margin-top:24px;font-size:10px;color:#9299a5}.text-small{font-size:12px}
@media(max-width:720px){#linear-next-view{padding:28px 20px}#linear-next-view h2{font-size:30px}#linear-next-view .queue-heading{align-items:flex-start;flex-direction:column}#linear-next-view .queue-overview{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px}#linear-next-view .project-grid{grid-template-columns:1fr}#linear-next-view .nav{gap:20px}#linear-next-view .queue-item{padding:18px}}
#linear-next-view .project-section{margin-top:24px}
#linear-next-view .project-section:first-child{margin-top:0}
#linear-next-view .project-heading{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:14px;font-weight:650;letter-spacing:0;color:#3a4250}
#linear-next-view .project-count{font-size:11px;font-weight:400;color:#858c99}
#linear-next-view .project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
#linear-next-view .queue-item>p:not(.queue-kicker){margin-top:10px}
#linear-next-view .queue-links .btn{margin-left:auto}
#linear-next-view #queue-edges>div{display:grid;gap:12px;margin-top:16px}
#linear-next-view .queue-section .project-grid{margin-top:12px}
#linear-next-view .queue-section .queue-item{margin-top:0}
@media(max-width:720px){#linear-next-view .project-grid{grid-template-columns:1fr}#linear-next-view .queue-heading{gap:16px}#linear-next-view .queue-heading .btn-primary{align-self:flex-start}#linear-next-view .queue-overview{margin-top:20px}#linear-next-view .queue-links{align-items:flex-start}#linear-next-view .queue-links .btn{margin-left:0}}
</style>
<script>
(() => {
  const root = document.getElementById('linear-next-view');
  const data = /*QUEUE_DATA*/null;
  const el = id => root.querySelector('#' + id);
  const batch = new Set(data.recommendations.map(i => i.id));
  const metrics = [[data.recommendations.length,'Ready for your next batch'],[data.issues.filter(i=>i.state==='active').length,'Work in flight'],[data.issues.filter(i=>!batch.has(i.id)&&i.state!=='active'&&i.state!=='closed').length,'Held for review'],[data.inferredEdges.length,'Dependencies reviewed']];
  for(const [value,label] of metrics){const card=document.createElement('div');card.className='metric';const n=document.createElement('strong');n.textContent=value;const l=document.createElement('span');l.textContent=label;card.append(n,l);el('queue-overview').append(card);}

  const h = (tag, text, cls) => {const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
  const safeUrl = raw => {try {const u=new URL(raw);return u.protocol==='https:'?u.href:null;}catch{return null;}};
  const fmt = iso => new Date(iso).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  el('queue-meta').textContent = data.issues.length + ' tickets · ' + data.issues.filter(i=>i.state==='active').length + ' in flight · checked ' + fmt(data.capturedAt);
  el('queue-foot').textContent = 'Hourly local refresh · recommendations require a fresh check before starting · no tickets changed';
  const context = 'Follow the internal_tools.linear_next REFRESH.md workflow. Use queue directory '+(data.queueDirectory||'the configured local queue directory')+'. ';
  const refreshPrompt = context+'Refresh the Linear task queue now: pull fresh Linear and concurrent-work evidence, rebuild the local view, and show the updated queue here.';
  async function ask(prompt, button) {
    if (!window.openai?.sendFollowUpMessage) {
      el('queue-status').textContent = 'To pull fresh data, use Run now in the hourly task, or ask this Codex chat: “Refresh the Linear queue.”';
      return;
    }
    button.disabled = true;
    try {
      await window.openai.sendFollowUpMessage({prompt, title:'Refresh Linear task readiness'});
      el('queue-status').textContent = 'Refresh requested. The next response will contain the updated view.';
    } catch {el('queue-status').textContent='Refresh was not submitted. Try again.';}
    finally {button.disabled=false;}
  }
  el('queue-refresh').addEventListener('click',()=>ask(refreshPrompt,el('queue-refresh')));
  const checks=[];
  function item(row, recommend=false) {
    const box=h('article',undefined,'queue-item');
    box.append(h('p',row.id+(recommend?' · unlocks '+(row.unlocks||0)+' downstream tickets':' · '+row.state),'text-small queue-kicker'));
    box.append(h('h3',row.title));
    box.append(h('p',row.reasons.join(' '),'queue-reason'));
    if(row.pending.length)box.append(h('p','Pending: '+row.pending.join(', '),'text-small'));
    const links=h('div',undefined,'viz-row queue-links');
    const url=safeUrl(row.url);
    if(url){const a=h('a','Open '+row.id);a.href=url;a.target='_blank';a.rel='noopener noreferrer';links.append(a);}
    if(recommend){
      const b=h('button','Recheck before starting','btn');b.type='button';
      b.addEventListener('click',()=>ask(context+'Recheck '+row.id+' before starting. Refresh issue status, comments, dependencies, duplicates, active chats, repository state and PRs. Report the exact bounded scope and any conflicts. This is a readiness check only; do not launch work or reassign tickets.',b));
      links.append(b);checks.push(b);
    }
    box.append(links);
    if(row.evidence.length||row.resources.length){
      const d=h('details');d.append(h('summary','Evidence and ownership'));
      const ul=h('ul');row.evidence.forEach(e=>ul.append(h('li',typeof e==='string'?e:JSON.stringify(e))));
      if(row.resources.length)ul.append(h('li','Owns: '+row.resources.join(', ')));
      d.append(ul);box.append(d);
    }
    return box;
  }
  function projects(rows) {
    const groups=new Map();
    for(const row of rows){const name=row.project||'No project';if(!groups.has(name))groups.set(name,[]);groups.get(name).push(row);}
    return [...groups].sort(([a],[b])=>a.localeCompare(b));
  }
  function projectSection(name, rows) {
    const section=h('section',undefined,'project-section');
    const heading=h('h3',name,'project-heading');
    heading.append(h('span',rows.length+' '+(rows.length===1?'task':'tasks'),'project-count'));
    section.append(heading);return section;
  }
  function projectCards(target, rows, recommend=false){
    for(const [name,items] of projects(rows)){
      const section=projectSection(name,items),grid=h('div',undefined,'project-grid');
      items.forEach(row=>grid.append(item(row,recommend)));section.append(grid);target.append(section);
    }
  }
  if(!data.recommendations.length)el('queue-next').append(h('p','No independently reviewed task is eligible in this snapshot. Review held work or refresh the evidence.'));
  else {
    el('queue-next').append(h('p',data.recommendations.length+' '+(data.recommendations.length===1?'task with reviewed ownership; no pending dependency.':'tasks with separate reviewed ownership; no pending dependency within the batch.'),'text-small queue-kicker'));
    projectCards(el('queue-next'),data.recommendations,true);
  }
  const active=data.issues.filter(i=>i.state==='active');
  projectCards(el('queue-work'),active);
  if(!active.length)el('queue-work').append(h('p','No work is currently in flight.','queue-kicker'));
  const held=data.issues.filter(i=>!batch.has(i.id)&&i.state!=='active');
  for(const [name,items] of projects(held)) {
    const section=projectSection(name,items);
    for(const [state,label] of [['conflict','Concurrent-work conflicts'],['blocked','Waiting on deliverables'],['sequenced','Sequence after this batch'],['review','Needs review'],['owned','Already owned'],['backlog','Backlog'],['container','Tracking tickets'],['ready','More eligible work'],['closed','Completed or canceled']]) {
      const rows=items.filter(i=>i.state===state);if(!rows.length)continue;
      const d=h('details',undefined,'queue-section');d.append(h('summary',label+' · '+rows.length));
      const grid=h('div',undefined,'project-grid');rows.forEach(i=>grid.append(item(i)));d.append(grid);section.append(d);
    }
    el('queue-held').append(section);
  }
  if(data.activeConflicts.length)el('queue-work').prepend(h('p','Active scopes already overlap: '+data.activeConflicts.map(x=>x.join(' / ')).join('; '),'queue-reason'));
  const duplicateRows=data.issues.filter(i=>i.duplicates.length);
  el('queue-edges').append(h('p',duplicateRows.length?'Possible duplicate scopes require reconciliation; none were merged.':'No probable full duplicate found in this review. Partial overlaps appear below.'));
  const list=h('div');
  data.inferredEdges.forEach(e=>{const a=h('article',undefined,'queue-item');a.append(h('p',e.from+' → '+e.to+' · '+e.kind.replaceAll('_',' '),'text-small queue-kicker'));a.append(h('p',e.evidence));list.append(a);});
  el('queue-edges').append(list);
  // Native host tabs also use this state. Local handler keeps standalone files usable.
  for(const button of root.querySelectorAll('[role=tab]'))button.addEventListener('click',()=>{
    root.querySelectorAll('[role=tab]').forEach(b=>{const chosen=b===button;b.classList.toggle('active',chosen);b.setAttribute('aria-selected',String(chosen));el(b.getAttribute('aria-controls')).hidden=!chosen;});
    window.openai?.setWidgetState?.({modelContent:{queueTab:button.id},privateContent:null}).catch(()=>{});
  });
  function restore(state){const id=state?.modelContent?.queueTab;const b=id&&root.querySelector('#'+id);if(b&&b.getAttribute('role')==='tab'){root.querySelectorAll('[role=tab]').forEach(t=>{const on=t===b;t.classList.toggle('active',on);t.setAttribute('aria-selected',String(on));el(t.getAttribute('aria-controls')).hidden=!on;});}}
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  function freshness(){
    const stale=Date.now()-Date.parse(data.capturedAt)>data.maxAgeSeconds*1000;
    if(stale||data.gaps.length||!data.reviewValid){
      el('queue-status').textContent = stale?'This snapshot is over two hours old. Refresh before choosing work.':'Readiness is withheld: '+(data.gaps.join(', ')||'review does not match snapshot');
      checks.forEach(b=>b.disabled=true);
    }
  }
  freshness();setInterval(freshness,60000);
})();
</script>

name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
      - name: Install locked dependencies
        run: uv sync --locked --no-editable --python 3.11
      - name: Check code complexity and lint
        run: uv run --locked --no-editable ruff check .
      - name: Check function length
        run: uv run --locked --no-editable python scripts/check_function_length.py
      - name: Check routing schemas
        run: uv run --locked --no-editable python scripts/generate_model_router_schemas.py --check
      - name: Run tests
        run: uv run --locked --no-editable python -m unittest discover -s tests -v
